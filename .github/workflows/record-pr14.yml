name: Record PR 14 simulator fixtures
on:
  push:
    branches: [codex/chapter-intro-credit-fallback]
    paths: [.github/workflows/record-pr14.yml]
permissions:
  contents: read
jobs:
  record:
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - run: brew install sdl2_ttf cmake pkg-config
      - run: make sim-macos SIM_TDIR=rust-modules/target-sim-ci
      - name: Record three flows
        run: |
          export SIM_BIN="$GITHUB_WORKSPACE/rust-modules/target-sim-ci/debug/plxnative-sim"
          export OUT="$RUNNER_TEMP/plxnative-recordings"
          bash tests/focusfp.sh --rec --only 1,6,12
      - uses: actions/upload-artifact@v4
        with:
          name: pr14-simulator-recordings
          path: ${{ runner.temp }}/plxnative-recordings/root-*/plxnative-recordings/
          if-no-files-found: error
