name: Record PR 14 simulator fixtures
on:
  push:
    branches: [codex/pr14-macos-diagnosis]
    paths: [.github/workflows/record-pr14.yml]
permissions:
  contents: read
jobs:
  record:
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - run: brew install sdl2_ttf cmake pkg-config
      - run: make sim-macos SIM_TDIR=rust-modules/target-sim-ci
      - name: Record three flows
        run: |
          export SIM_BIN="$GITHUB_WORKSPACE/rust-modules/target-sim-ci/debug/plxnative-sim"
          export OUT="$RUNNER_TEMP/plxnative-recordings"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/focusfp.sh')
          s = p.read_text()
          old = '''; sleep "$STEP" ;;'''
          new = '''; sleep "$STEP"; echo "After key $tok"; grep '^focus ' "$log" | tail -1 || true ;;'''
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          PY
          FOCUS_BOOT_SETTLE=8 FOCUS_STEP=2 bash tests/focusfp.sh --rec --only 1
          MOCK_PORT=32501 bash tests/focusfp.sh --rec --only 6,12 || { cat "$OUT/mock_pms.log"; exit 1; }
          for fixture in 1-boot-home-chip-grid 6-settings-family 12-filmography-detail-return; do
            source="$OUT/root-${fixture%%-*}/plxnative-recordings/latest"
            python3 tools/plxnative-rec check "$source"
            python3 tools/plxnative-rec rerecord "$source" "$fixture"
          done
          python3 tests/replay_fixtures.py --window 960x540 --sim "$SIM_BIN" --output "$RUNNER_TEMP/pr14-replay"
      - uses: actions/upload-artifact@v4
        with:
          name: pr14-simulator-recordings
          path: tests/fixtures/replay/*/
          if-no-files-found: error
