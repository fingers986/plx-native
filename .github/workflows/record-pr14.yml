name: Record PR 14 simulator fixtures
on:
  push:
    branches: [codex/pr14-macos-diagnosis]
    paths: [.github/workflows/record-pr14.yml]
permissions:
  contents: read
jobs:
  record:
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - run: brew install sdl2_ttf cmake pkg-config
      - run: make sim-macos SIM_TDIR=rust-modules/target-sim-ci
      - name: Record three flows
        run: |
          export SIM_BIN="$GITHUB_WORKSPACE/rust-modules/target-sim-ci/debug/plxnative-sim"
          export OUT="$RUNNER_TEMP/plxnative-recordings"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/focusfp.sh')
          s = p.read_text()
          old = '''; sleep "$STEP" ;;'''
          new = '''; sleep "$STEP"; echo "After key $tok"; grep '^focus ' "$log" | tail -1 || true ;;'''
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          PY
          FOCUS_BOOT_SETTLE=8 FOCUS_STEP=2 bash tests/focusfp.sh --rec --only 1 || {
            if test -f "$OUT/1-boot-home-chip-grid.fp"; then
              cat "$OUT/1-boot-home-chip-grid.fp"
            fi
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: pr14-simulator-recordings
          path: ${{ runner.temp }}/plxnative-recordings/root-*/plxnative-recordings/
          if-no-files-found: error
