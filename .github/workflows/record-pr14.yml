name: Import validated PR 14 fixtures
on:
  push:
    branches: [codex/pr14-macos-diagnosis]
    paths: [.github/workflows/record-pr14.yml]
permissions:
  actions: read
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/chapter-intro-credit-fallback
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42497762370
          name: pr14-simulator-recordings
          path: fixture-import
      - run: |
          set -euo pipefail
          for name in 1-boot-home-chip-grid 6-settings-family 12-filmography-detail-return; do
            test -f "fixture-import/$name/manifest.json"
            python3 tools/plxnative-rec check "fixture-import/$name"
            python3 tools/plxnative-rec rerecord "fixture-import/$name" "$name"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tests/fixtures/replay
          git commit -m 'Refresh validated macOS replay fixtures'
          git push origin HEAD:refs/heads/codex/chapter-intro-credit-fallback
